<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" width="780" height="730" role="img" aria-label="Nine numbered state folders: tasks flow down the happy path from 1-outstanding to 6-complete, with off-ramps to 7-blocked when a gate trips, and reopen paths back into the loop.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="780" height="730" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- legend -->
    <g font-size="12" fill="#334155">
      <rect x="40" y="8" width="13" height="13" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="59" y="19">the loop works these</text>
      <rect x="196" y="8" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="215" y="19">waiting on you</text>
      <rect x="318" y="8" width="13" height="13" rx="3" fill="#ede9fe" stroke="#7c3aed"/><text x="337" y="19">with the team</text>
      <rect x="434" y="8" width="13" height="13" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="453" y="19">parked</text>
      <rect x="510" y="8" width="13" height="13" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="529" y="19">shipped</text>
    </g>

    <!-- answered return path (drawn under boxes) -->
    <path d="M 600 200 L 600 48 L 200 48 L 200 55" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>
    <text x="402" y="40" font-size="12" fill="#b45309" text-anchor="middle">you answer or decide — the task drops back into the loop</text>

    <!-- reopen path from in-review (left side) -->
    <path d="M 40 536 L 20 536 L 20 96 L 33 96" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrViolet)"/>
    <text transform="rotate(-90 11 316)" x="11" y="316" font-size="11.5" fill="#7c3aed" text-anchor="middle">a PR comment reports a defect — reopened as changes-requested</text>

    <!-- happy-path boxes -->
    <g font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">
      <rect x="40" y="60"  width="320" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="40" y="170" width="320" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="40" y="280" width="320" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="40" y="390" width="320" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <rect x="40" y="500" width="320" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="40" y="610" width="320" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="56" y="88">1-outstanding/</text>
      <text x="56" y="198">2-branched/</text>
      <text x="56" y="308">3-checking/</text>
      <text x="56" y="418">4-ready/</text>
      <text x="56" y="528">5-in-review/</text>
      <text x="56" y="638">6-complete/</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="56" y="110">captured · expanded · prompted</text>
      <text x="56" y="220">code committed — queued for its UI check</text>
      <text x="56" y="330">UI check in flight — at most one at a time</text>
      <text x="56" y="440">checked &amp; evidenced — awaiting your diff review</text>
      <text x="56" y="550">PR open — the loop watches it</text>
      <text x="56" y="660">shipped</text>
    </g>

    <!-- happy-path arrows + labels -->
    <g stroke="#475569" stroke-width="1.5">
      <line x1="200" y1="136" x2="200" y2="164" marker-end="url(#arr)"/>
      <line x1="200" y1="246" x2="200" y2="274" marker-end="url(#arr)"/>
      <line x1="200" y1="356" x2="200" y2="384" marker-end="url(#arr)"/>
      <line x1="200" y1="466" x2="200" y2="494" marker-end="url(#arr)"/>
      <line x1="200" y1="576" x2="200" y2="604" marker-end="url(#arr)"/>
    </g>
    <g font-size="12" fill="#475569">
      <text x="212" y="155">code written &amp; verified on its own branch</text>
      <text x="212" y="265">oldest branch gets its UI check</text>
      <text x="212" y="375">PASS — screenshots attached</text>
      <text x="212" y="485">you approve the diff &amp; open the PR</text>
      <text x="212" y="595">the PR merges — auto-completed</text>
    </g>

    <!-- off-ramp boxes -->
    <rect x="460" y="200" width="280" height="100" rx="8" fill="#fef3c7" stroke="#dc2626" stroke-width="1.5"/>
    <text x="476" y="228" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">7-blocked/</text>
    <g font-size="12" fill="#475569">
      <text x="476" y="250">blocked-ambiguity · verify-failed ·</text>
      <text x="476" y="266">check-failed</text>
      <text x="476" y="288" font-style="italic" fill="#b45309">needs a decision from you</text>
    </g>

    <rect x="460" y="390" width="280" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="476" y="418" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">8-paused/</text>
    <text x="476" y="440" font-size="12" fill="#475569">do-not-start — never auto-advanced</text>

    <rect x="460" y="490" width="280" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="476" y="518" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">9-abandoned/</text>
    <text x="476" y="540" font-size="12" fill="#475569">kept as a record, never scanned</text>

    <!-- gate-trip arrows -->
    <line x1="360" y1="96" x2="454" y2="212" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
    <text x="468" y="172" font-size="11.5" fill="#dc2626">ambiguity or verify</text>
    <text x="468" y="188" font-size="11.5" fill="#dc2626">gate trips</text>
    <line x1="360" y1="316" x2="454" y2="280" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
    <text x="466" y="318" font-size="11.5" fill="#dc2626">check fails in the running app</text>
  </g>
</svg>
