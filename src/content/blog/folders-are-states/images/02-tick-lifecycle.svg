<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="One loop tick: orient and gate, gather state, advance the queue, write and verify, UI check, PR sweeps, digest, then schedule the next tick with an adaptive delay between three minutes and two hours.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="940" height="400" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- legend -->
    <g font-size="12" fill="#334155">
      <rect x="70" y="19" width="13" height="13" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="89" y="30">cheap — reads &amp; files state</text>
      <rect x="268" y="19" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="287" y="30">heavy — spawns coding / checking agents</text>
    </g>

    <!-- loop-back path -->
    <path d="M 70 275 L 34 275 L 34 105 L 63 105" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text transform="rotate(-90 24 190)" x="24" y="190" font-size="11.5" fill="#475569" text-anchor="middle">next tick in 3 min – 2 h</text>

    <!-- row 1 boxes -->
    <rect x="70"  y="60" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="286" y="60" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="502" y="60" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="718" y="60" width="190" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <!-- row 2 boxes -->
    <rect x="718" y="230" width="190" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="502" y="230" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="286" y="230" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="70"  y="230" width="190" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

    <!-- step chips -->
    <g font-size="11" font-weight="bold" text-anchor="middle">
      <circle cx="92" cy="84" r="11" fill="#2563eb"/><text x="92" y="88" fill="#ffffff">0</text>
      <circle cx="308" cy="84" r="11" fill="#2563eb"/><text x="308" y="88" fill="#ffffff">1</text>
      <circle cx="524" cy="84" r="11" fill="#2563eb"/><text x="524" y="88" fill="#ffffff">2</text>
      <circle cx="740" cy="84" r="11" fill="#d97706"/><text x="740" y="88" fill="#ffffff">3</text>
      <circle cx="740" cy="254" r="11" fill="#d97706"/><text x="740" y="258" fill="#ffffff">4</text>
      <circle cx="524" cy="254" r="11" fill="#2563eb"/><text x="524" y="258" fill="#ffffff">5</text>
      <circle cx="308" cy="254" r="11" fill="#2563eb"/><text x="308" y="258" fill="#ffffff">6</text>
      <circle cx="92" cy="254" r="11" fill="#2563eb"/><text x="92" y="258" fill="#ffffff">7</text>
    </g>

    <!-- titles -->
    <g font-size="14" font-weight="bold" fill="#0f172a">
      <text x="110" y="89">Orient &amp; gate</text>
      <text x="326" y="89">Gather state</text>
      <text x="542" y="89">Advance the queue</text>
      <text x="758" y="89">Write + verify</text>
      <text x="758" y="259">UI check</text>
      <text x="542" y="259">PR sweeps</text>
      <text x="326" y="259">Digest</text>
      <text x="110" y="259">Schedule next tick</text>
    </g>

    <!-- details -->
    <g font-size="11.5" fill="#475569">
      <text x="86" y="115">kill switch, work window —</text>
      <text x="86" y="131">out of hours? just reschedule</text>
      <text x="302" y="115">read every task file, reconcile</text>
      <text x="302" y="131">folders, sweep the ambiguity gate</text>
      <text x="518" y="115">expand new captures, apply</text>
      <text x="518" y="131">WIP limits &amp; dependency order</text>
      <text x="734" y="115">fresh worktree, writer agent,</text>
      <text x="734" y="131">baseline ladder, self-review</text>
      <text x="734" y="285">boot the app, prove behaviour,</text>
      <text x="734" y="301">capture screenshot evidence</text>
      <text x="518" y="285">draft teammate reviews, read</text>
      <text x="518" y="301">comments on the loop's PRs</text>
      <text x="302" y="285">status file + one-line counts:</text>
      <text x="302" y="301">whose court is everything in?</text>
      <text x="86" y="285">momentum · steady · idle</text>
      <text x="86" y="301">backoff — then sleep</text>
    </g>

    <!-- flow arrows -->
    <g stroke="#475569" stroke-width="1.5">
      <line x1="262" y1="105" x2="280" y2="105" marker-end="url(#arr)"/>
      <line x1="478" y1="105" x2="496" y2="105" marker-end="url(#arr)"/>
      <line x1="694" y1="105" x2="712" y2="105" marker-end="url(#arr)"/>
      <line x1="813" y1="152" x2="813" y2="224" marker-end="url(#arr)"/>
      <line x1="716" y1="275" x2="698" y2="275" marker-end="url(#arr)"/>
      <line x1="500" y1="275" x2="482" y2="275" marker-end="url(#arr)"/>
      <line x1="284" y1="275" x2="266" y2="275" marker-end="url(#arr)"/>
    </g>
  </g>
</svg>
