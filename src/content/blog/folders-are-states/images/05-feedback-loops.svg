<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="Two PR sweeps close the loop: comments on the loop's own PRs are verified and reopen the task as changes-requested; a merge auto-completes it; teammates' PRs get local review drafts that are never posted.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- GitHub container -->
    <rect x="650" y="48" width="270" height="402" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="1.5"/>
    <text x="785" y="72" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">THE CODE HOST</text>

    <rect x="670" y="80" width="230" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="686" y="106" font-size="13.5" font-weight="bold" fill="#0f172a">your open PRs</text>
    <text x="686" y="126" font-size="11.5" fill="#475569">carrying loop-written branches</text>

    <rect x="670" y="365" width="230" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="686" y="391" font-size="13.5" font-weight="bold" fill="#0f172a">teammates' PRs</text>
    <text x="686" y="411" font-size="11.5" fill="#475569">everything ready for review</text>

    <!-- left pipeline boxes -->
    <rect x="40" y="60" width="250" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="56" y="86" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">5-in-review/</text>
    <text x="56" y="107" font-size="11.5" fill="#475569">the PR is open — the loop watches</text>

    <rect x="40" y="210" width="250" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="56" y="236" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">1-outstanding/</text>
    <text x="56" y="257" font-size="11.5" fill="#475569">the comment becomes the new brief</text>

    <rect x="40" y="350" width="250" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="56" y="376" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#0f172a">6-complete/</text>
    <text x="56" y="397" font-size="11.5" fill="#475569">filed only when the merge is a fact</text>

    <!-- middle chips -->
    <rect x="360" y="120" width="230" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="376" y="143" font-size="13" font-weight="bold" fill="#0f172a">comment sweep</text>
    <g font-size="11" fill="#475569">
      <text x="376" y="161">reads every new comment; a</text>
      <text x="376" y="176">seen-comment ledger keeps it</text>
      <text x="376" y="191">idempotent; verifies the claim</text>
      <text x="376" y="206">against the code before acting</text>
    </g>

    <rect x="360" y="355" width="230" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="376" y="378" font-size="13" font-weight="bold" fill="#0f172a">review drafter</text>
    <g font-size="11" fill="#475569">
      <text x="376" y="396">read-only pass over every</text>
      <text x="376" y="411">teammate PR — drafts saved</text>
      <text x="376" y="426">locally, never posted; stamped</text>
      <text x="376" y="441">with the PR's head SHA</text>
    </g>

    <!-- arrows -->
    <line x1="294" y1="95" x2="662" y2="112" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arr)"/>
    <text x="640" y="86" font-size="11.5" fill="#64748b" text-anchor="end">watches — CI, head SHA, merge state</text>

    <line x1="666" y1="132" x2="596" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="648" y="124" font-size="11.5" fill="#475569" text-anchor="end">new comments</text>

    <line x1="360" y1="185" x2="296" y2="230" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>
    <text x="352" y="230" font-size="11.5" fill="#dc2626">verified defect → reopened as changes-requested</text>

    <path d="M 785 150 L 785 330 L 155 330 L 155 343" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
    <text x="470" y="322" font-size="11.5" fill="#16a34a" text-anchor="middle">PR merged → the task auto-completes</text>

    <line x1="666" y1="400" x2="596" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>
</svg>
