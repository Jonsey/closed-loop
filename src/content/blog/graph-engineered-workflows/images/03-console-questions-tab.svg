<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img" aria-label="The console: a kanban board across the state folders on the left, and on the right the task drawer's questions tab showing one open item as a card with press-to-answer option buttons, a free-text override, and two actions: save answers, and answer and unblock.">
  <rect width="780" height="560" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- window chrome -->
    <rect x="20" y="20" width="740" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="40" cy="38" r="4" fill="#cbd5e1"/><circle cx="54" cy="38" r="4" fill="#cbd5e1"/><circle cx="68" cy="38" r="4" fill="#cbd5e1"/>
    <text x="390" y="42" font-size="11" text-anchor="middle" fill="#64748b">/board — the graph, rendered</text>

    <!-- board columns -->
    <g font-size="10" font-family="Menlo, Consolas, monospace">
      <!-- col 1 -->
      <rect x="34" y="58" width="82" height="466" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/>
      <text x="75" y="74" text-anchor="middle" fill="#1e40af" font-size="9">1-outstanding</text>
      <rect x="40" y="84" width="70" height="38" rx="4" fill="#ffffff" stroke="#93c5fd"/><rect x="44" y="110" width="34" height="8" rx="2" fill="#bfdbfe"/><text x="61" y="116" font-size="6" text-anchor="middle" fill="#1e40af">PROMPTED</text>
      <rect x="40" y="128" width="70" height="38" rx="4" fill="#ffffff" stroke="#93c5fd"/><rect x="44" y="154" width="40" height="8" rx="2" fill="#bfdbfe"/><text x="64" y="160" font-size="6" text-anchor="middle" fill="#1e40af">DEP BLOCKED</text>
      <rect x="40" y="172" width="70" height="38" rx="4" fill="#ffffff" stroke="#93c5fd"/><rect x="44" y="198" width="30" height="8" rx="2" fill="#bfdbfe"/><text x="59" y="204" font-size="6" text-anchor="middle" fill="#1e40af">REWORK</text>
      <!-- col 2 -->
      <rect x="122" y="58" width="82" height="466" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/>
      <text x="163" y="74" text-anchor="middle" fill="#1e40af">2-branched</text>
      <rect x="128" y="84" width="70" height="38" rx="4" fill="#ffffff" stroke="#93c5fd"/>
      <!-- col 3 -->
      <rect x="210" y="58" width="82" height="466" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/>
      <text x="251" y="74" text-anchor="middle" fill="#1e40af">3-checking</text>
      <rect x="216" y="84" width="70" height="38" rx="4" fill="#ffffff" stroke="#93c5fd"/><text x="251" y="106" font-size="7" text-anchor="middle" fill="#64748b">⏳ max 1</text>
      <!-- col 4 -->
      <rect x="298" y="58" width="82" height="466" rx="6" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/>
      <text x="339" y="74" text-anchor="middle" fill="#92400e">4-ready</text>
      <rect x="304" y="84" width="70" height="38" rx="4" fill="#ffffff" stroke="#fcd34d"/><text x="339" y="106" font-size="7" text-anchor="middle" fill="#64748b">📎 8 shots</text>
      <rect x="304" y="128" width="70" height="38" rx="4" fill="#ffffff" stroke="#fcd34d"/><text x="339" y="150" font-size="7" text-anchor="middle" fill="#b45309">🟠 flagged</text>
      <text x="339" y="516" text-anchor="middle" fill="#92400e" font-size="8">2 / cap 6</text>
      <!-- col 7 -->
      <rect x="386" y="58" width="82" height="466" rx="6" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/>
      <text x="427" y="74" text-anchor="middle" fill="#92400e">7-blocked</text>
      <rect x="392" y="84" width="70" height="38" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="427" y="99" font-size="7" text-anchor="middle" fill="#0f172a">list refresh</text><text x="427" y="112" font-size="7" text-anchor="middle" fill="#b45309">🚩 1 open</text>
      <rect x="392" y="128" width="70" height="38" rx="4" fill="#ffffff" stroke="#fcd34d"/><text x="427" y="150" font-size="7" text-anchor="middle" fill="#b45309">🚩 2 open</text>
      <text x="427" y="516" text-anchor="middle" fill="#92400e" font-size="8">2 / cap 10</text>
    </g>
    <!-- selection connector -->
    <path d="M462,103 L490,103" stroke="#b45309" stroke-width="1.5" fill="none"/>

    <!-- drawer -->
    <rect x="490" y="58" width="258" height="466" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="502" y="78" font-size="12" font-weight="bold" fill="#0f172a">Paginated list drops rows on refresh</text>
    <g font-size="9" fill="#64748b">
      <text x="502" y="96">overview</text>
      <rect x="546" y="86" width="72" height="14" rx="3" fill="#fef3c7"/><text x="582" y="96" text-anchor="middle" fill="#92400e" font-weight="bold">ambiguity (1)</text>
      <text x="626" y="96">evidence (0)</text>
      <text x="684" y="96">diff</text>
      <text x="706" y="96">chat</text>
    </g>
    <line x1="502" y1="104" x2="736" y2="104" stroke="#e2e8f0"/>
    <text x="502" y="122" font-size="9" fill="#92400e" font-weight="bold">1 OPEN QUESTION BLOCKING THE LOOP</text>
    <text x="728" y="150" font-size="7.5" text-anchor="end" fill="#94a3b8" font-family="Menlo, Consolas, monospace">grammar: numbered</text>

    <!-- item card -->
    <rect x="502" y="132" width="234" height="300" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="510" y="140" width="26" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="523" y="150" font-size="8" text-anchor="middle" fill="#92400e">🚩 3</text>
    <g font-size="10" fill="#0f172a">
      <text x="510" y="172" font-weight="bold">Should a refresh keep the user's</text>
      <text x="510" y="185" font-weight="bold">scroll position, or reset it?</text>
    </g>
    <g font-size="8.5" fill="#475569">
      <text x="510" y="203"><tspan font-weight="bold">Context:</tspan> the list rebuilds state after a refresh.</text>
      <text x="510" y="216"><tspan font-weight="bold">Right now:</tspan> it jumps to the top (rebuilt from page 1).</text>
    </g>
    <!-- option buttons -->
    <g font-size="9">
      <rect x="510" y="228" width="218" height="24" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <text x="519" y="243" fill="#1e40af" font-weight="bold">★ (a) keep position</text><text x="720" y="243" text-anchor="end" fill="#1e40af" font-size="8">recommended</text>
      <rect x="510" y="256" width="218" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="519" y="271" fill="#334155">(b) reset to top</text><text x="720" y="271" text-anchor="end" fill="#64748b" font-size="8">simpler, jarring</text>
      <rect x="510" y="284" width="218" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="519" y="299" fill="#334155">(c) keep only if same page loaded</text>
    </g>
    <!-- free text -->
    <rect x="510" y="316" width="218" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="518" y="333" font-size="9" fill="#94a3b8">Your ruling… (free text overrides the buttons)</text>
    <text x="510" y="372" font-size="8" fill="#64748b" font-style="italic">Detail: useListState.ts rebuilds from pages[0] …</text>
    <text x="510" y="392" font-size="7.5" fill="#94a3b8">No marker on this item? Answering stamps a ✅ so the</text>
    <text x="510" y="402" font-size="7.5" fill="#94a3b8">loop stops re-blocking it.</text>
    <text x="510" y="422" font-size="7.5" fill="#94a3b8" font-family="Menlo, Consolas, monospace">if_mtime: 1757580912.44 → 409 if the file moved</text>

    <!-- action buttons -->
    <rect x="502" y="444" width="104" height="30" rx="6" fill="#ffffff" stroke="#475569"/>
    <text x="554" y="463" font-size="10" text-anchor="middle" fill="#0f172a">save answers</text>
    <rect x="614" y="444" width="122" height="30" rx="6" fill="#16a34a"/>
    <text x="675" y="463" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">⚡ answer &amp; unblock</text>
    <g font-size="8" fill="#64748b">
      <text x="502" y="492">records rulings,</text>
      <text x="502" y="502">task stays put</text>
      <text x="614" y="492">also moves the file → 1-outstanding/</text>
      <text x="614" y="502">has a branch? stage = changes-requested</text>
    </g>
  </g>
</svg>
